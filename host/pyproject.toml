[project]
name = "keypad"
version = "2.2.0"
description = "Hardware keypad for Claude Code: the PC side (agent, tray, hooks)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "pyserial>=3.5",
    "zeroconf>=0.136",
    "pystray>=0.19.5",
    "Pillow>=10.4",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
keypad = "keypad.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keypad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E731", "B023"]  # long lines are wrapped by hand; lambdas in menus bind loop vars on purpose
