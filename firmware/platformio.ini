; Keypad firmware - LILYGO T-Display S3 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
; Build: pio run            Flash: pio run -t upload            Host tests: pio test -e native
; The version comes from include/config.h unless the build sets it, e.g.
;   PLATFORMIO_BUILD_FLAGS='-DKEYPAD_FW_VERSION=\"2.1.0\"' pio run   (make firmware does this)

[platformio]
default_envs = keypad

[env:keypad]
; pioarduino = Arduino core 3.x (ESP-IDF 5) for PlatformIO
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = default_16MB.csv   ; two OTA app slots
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1          ; Hardware CDC and JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB (GPIO43/44 are matrix columns!)
    -DCORE_DEBUG_LEVEL=0          ; the serial line carries only protocol JSON
    -Wall
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.7
    bblanchon/ArduinoJson @ 7.4.3
    olikraus/U8g2 @ 2.36.18

; Debug build: logs key events and accepts {"t":"key","key":n} over USB to
; simulate presses (for bench tests). Never ship this.
[env:keypad-debug]
extends = env:keypad
build_flags = ${env:keypad.build_flags} -DKEYPAD_DEBUG

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Isrc -Iinclude -DNATIVE_TEST
build_src_filter = -<*> +<text/>
test_build_src = yes
