name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  host:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/keypad

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware
      - run: pio run -e keypad
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/keypad/firmware.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, firmware]
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: host/internal/firmware/bin
      - name: bundle firmware
        shell: bash
        run: mv host/internal/firmware/bin/firmware.bin host/internal/firmware/bin/keypad.bin
      - name: macOS app
        if: runner.os == 'macOS'
        run: |
          V=${GITHUB_REF_NAME}
          VERSION=$V LDFLAGS="-s -w -X main.version=$V -X github.com/jameelhamdan/assistant-keypad/host/internal/firmware.Version=${V#v}" packaging/macos/build.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=${GITHUB_REF_NAME}
          L="-s -w -X main.version=$V -X github.com/jameelhamdan/assistant-keypad/host/internal/firmware.Version=${V#v}"
          mkdir -p dist/windows
          (cd host && go build -trimpath -ldflags "$L" -o ../dist/windows/keypad.exe ./cmd/keypad)
          (cd host && go build -trimpath -ldflags "$L -H windowsgui" -o ../dist/windows/keypadw.exe ./cmd/keypad)
          iscc //DVersion=${V#v} packaging/windows/keypad.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*setup.exe
