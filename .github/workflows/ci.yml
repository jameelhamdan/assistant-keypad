name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  host:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check keypad tests
      - run: uv run pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware
      - name: build (version = tag, so the keypad reports what the host bundles)
        working-directory: firmware
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; else V=dev-${GITHUB_SHA::7}; fi
          echo "$V" > firmware-version
          PLATFORMIO_BUILD_FLAGS="-DKEYPAD_FW_VERSION=\\\"$V\\\"" pio run -e keypad
      - name: stage (upload-artifact skips hidden folders such as .pio)
        run: |
          mkdir stage
          cp firmware/.pio/build/keypad/firmware.bin firmware/firmware-version stage/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: stage/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, firmware]
    permissions:
      contents: write   # create the release and attach the installers
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
        working-directory: host
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: bundle firmware
        shell: bash
        run: |
          cp fw/firmware.bin host/keypad/data/keypad.bin
          cp fw/firmware-version host/keypad/data/firmware-version
      - name: macOS app
        if: runner.os == 'macOS'
        run: VERSION=${GITHUB_REF_NAME#v} packaging/macos/build.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          packaging\windows\build.ps1 -Version $env:GITHUB_REF_NAME
          if (-not (Test-Path dist\*setup.exe)) { throw "the installer was not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*setup.exe
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
