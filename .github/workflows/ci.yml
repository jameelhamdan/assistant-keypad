name: ci

# Pushes and pull requests run the tests.
# To publish a release: Actions tab -> ci -> Run workflow, and enter the version (for example 3.1.0).
# That runs the tests, builds the firmware, the macOS DMG and the Windows installer, creates the tag
# v<version> on the chosen commit and attaches both installers to a GitHub release.
# Pushing a tag v* does the same.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 3.1.0 (the tag becomes v3.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # a newer push or pull-request run replaces an older one; a release run is never cancelled
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}   # "true" when this run publishes a release
      version: ${{ steps.v.outputs.version }}   # 3.1.0 for a release, dev-<sha> otherwise
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            V=${INPUT_VERSION#v}
            RELEASE=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            V=${GITHUB_REF_NAME#v}
            RELEASE=true
          else
            V=dev-${GITHUB_SHA::7}
            RELEASE=false
          fi
          if [ "$RELEASE" = true ]; then
            echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$' || { echo "::error::'$V' is not a version like 3.1.0"; exit 1; }
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "::error::tag v$V already exists"; exit 1
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  host:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check keypad tests
      - run: uv run pytest -q

  firmware:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware
      - name: build (the keypad reports the version the host bundles)
        working-directory: firmware
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          echo "$V" > firmware-version
          PLATFORMIO_BUILD_FLAGS="-DKEYPAD_FW_VERSION=\\\"$V\\\"" pio run -e keypad
      - name: stage (upload-artifact skips hidden folders such as .pio)
        run: |
          mkdir stage
          cp firmware/.pio/build/keypad/firmware.bin firmware/firmware-version stage/
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: stage/
          if-no-files-found: error

  sim:
    # the real firmware UI and key logic compiled for the PC, no hardware. It needs the libraries
    # that `pio run` fetches, so it runs a build first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio ziglang pillow pytest
      - run: pio run -e keypad
        working-directory: firmware
      - run: |
          python firmware/sim/build.py
          python -m pytest firmware/sim -q

  installer:
    if: needs.version.outputs.release == 'true'
    needs: [version, host, firmware, sim]
    strategy:
      matrix:
        include:
          - {os: macos-latest, asset: "dist/*.dmg"}
          - {os: windows-latest, asset: "dist/*setup.exe"}
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
        working-directory: host
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: fw
      - name: bundle firmware
        shell: bash
        run: |
          cp fw/firmware.bin host/keypad/data/keypad.bin
          cp fw/firmware-version host/keypad/data/firmware-version
      - name: macOS app
        if: runner.os == 'macOS'
        run: VERSION="$V" packaging/macos/build.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          packaging\windows\build.ps1 -Version $env:V
          if (-not (Test-Path dist\*setup.exe)) { throw "the installer was not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    # one job creates the release, so a failed build on either OS publishes nothing
    needs: [version, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keypad ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
